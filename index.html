<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#211918" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SQUAT BAR" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="app-icon.jpg" />
    <link rel="stylesheet" href="style.css" />
    <title>SQUAT BAR</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">SQUAT BAR</p>
        <h1 id="page-title"></h1>
      </header>

      <section id="home-page" class="page active" aria-label="ホーム">
        <article class="bar-card">
          <div class="bar-lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="bar-backdrop" aria-hidden="true"><span>◒</span><span>◇</span><span>◐</span></div>
          <div class="character-portrait"><img src="a_clean_cutout_transparent_background_illustration.png" alt="バーカウンターに立つスタッフ" /></div>
          <div class="counter-edge" aria-hidden="true"></div>
          <div class="bar-stools" aria-hidden="true"><span></span><span></span><span></span></div>
        </article>
        <article class="conversation-window"><p id="maid-name" class="maid-name">スタッフ：ルナ</p><p id="encouragement" class="maid-message"></p><span id="achievement-badge" class="achievement-badge" hidden>✦ 目標クリア</span></article>

        <article class="progress-card">
          <div class="progress-label"><span>今日のスクワット</span><div class="progress-actions"><button id="add-record-button" class="progress-action pencil-action" aria-label="スクワットを記録">✎</button><button id="share-button" class="progress-action x-action" aria-label="今日の記録をXへ投稿">𝕏</button><strong id="today-count">0 / 30 回</strong></div></div>
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        </article>

        <div class="stats-grid">
          <article class="stat-card"><strong id="streak-count">0</strong><span>連続達成日</span></article>
          <article class="stat-card"><strong id="total-count">0</strong><span>累計スクワット</span></article>
        </div>

        <article class="mission-card"><span>⚑</span><div><strong>本日のミッション</strong><p id="mission-text"></p></div></article>
      </section>

      <section id="history-page" class="page" aria-label="履歴">
        <div id="history-list" class="history-list"></div>
        <div id="history-empty" class="empty-state"><span>🗓️</span><h2>まだ記録がありません</h2><p>ホームから最初のスクワットを記録しましょう。</p></div>
      </section>

      <section id="collection-page" class="page" aria-label="屋敷">
        <p class="collection-summary">累計 <strong id="collection-total">0</strong> 回</p>
        <h2>スタッフ</h2><button id="show-fullbody-button" class="staff-showcase"><img src="a_clean_cutout_transparent_background_illustration.png" alt="スタッフの全身イラスト" /><span><strong id="staff-showcase-name">ルナ</strong><small>全身を見る</small></span><b>›</b></button><div id="maid-list" class="collection-list"></div>
        <h2>ごほうび</h2><div id="reward-list" class="collection-list"></div>
      </section>

      <section id="settings-page" class="page" aria-label="設定">
        <article class="settings-card"><label for="maid-name-input">スタッフの名前</label><input id="maid-name-input" class="settings-input" maxlength="20" value="ルナ" placeholder="例：ルナ" /><p class="input-hint">応援メッセージやスタッフ一覧に反映されます。</p></article>
        <article class="settings-card"><label for="goal-input">1日の目標回数</label><div class="goal-control"><button id="goal-minus" aria-label="目標を減らす">−</button><input id="goal-input" type="number" inputmode="numeric" min="5" max="500" step="5" value="30" aria-label="1日の目標回数" /><span>回</span><button id="goal-plus" aria-label="目標を増やす">＋</button></div></article>
        <article class="settings-card"><strong>リマインダー</strong><p class="input-hint">共有メニューから「リマインダー」を選び、通知時刻を設定できます。</p><button id="add-reminder-button" class="secondary-button">iPhoneのリマインダーに追加</button></article>
        <article class="settings-card about"><strong>SQUAT BAR</strong><p>カウンター越しのひとことと、毎日の小さな積み重ねを。</p></article>
      </section>
    </main>

    <nav class="tab-bar" aria-label="メインメニュー">
      <button class="tab active" data-page="home"><span>⌂</span>ホーム</button>
      <button class="tab" data-page="history"><span>▣</span>履歴</button>
      <button class="tab" data-page="collection"><span>✦</span>お店</button>
      <button class="tab" data-page="settings"><span>⚙</span>設定</button>
    </nav>

    <dialog id="record-dialog">
      <form id="record-form" method="dialog">
        <div class="dialog-header"><h2 id="record-dialog-title">記録する</h2><button class="close-button" value="cancel" aria-label="閉じる">×</button></div>
        <label class="form-label" for="count-input">今回のスクワット</label>
        <div class="count-picker"><button type="button" id="count-minus" aria-label="回数を減らす">−</button><input id="count-input" type="number" inputmode="numeric" min="1" max="500" value="10" aria-label="スクワット回数" /><span>回</span><button type="button" id="count-plus" aria-label="回数を増やす">＋</button></div>
        <label class="form-label" for="performed-at-input">日時</label>
        <input id="performed-at-input" type="datetime-local" />
        <label class="form-label" for="memo-input">メモ（任意）</label>
        <input id="memo-input" maxlength="80" placeholder="例：朝の運動" />
        <p class="maid-tip">「無理はしないで。フォームを整えて、気持ちよくいこう。」</p>
        <button id="record-save-button" class="primary-button" value="default">保存する</button>
      </form>
    </dialog>
    <dialog id="staff-dialog" class="staff-dialog">
      <button id="close-staff-dialog" class="close-button" aria-label="閉じる">×</button>
      <img src="a_clean_cutout_transparent_background_illustration.png" alt="スタッフの全身イラスト" />
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
