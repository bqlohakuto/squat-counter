<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6e4bc6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="スクワットメイド" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <title>スクワットメイド</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">SQUAT MAID</p>
        <h1 id="page-title">おかえりなさい</h1>
        <button class="icon-button" id="settings-button" aria-label="設定を開く">⚙</button>
      </header>

      <section id="home-page" class="page active" aria-label="ホーム">
        <article class="maid-card">
          <div class="maid-portrait" aria-hidden="true">🌙</div>
          <div>
            <p id="maid-name" class="maid-name">メイドのルナ</p>
            <p id="encouragement" class="maid-message"></p>
            <span id="achievement-badge" class="achievement-badge" hidden>✦ 目標達成</span>
          </div>
        </article>

        <article class="progress-card">
          <div class="progress-label"><span>今日のスクワット</span><strong id="today-count">0 / 30 回</strong></div>
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        </article>

        <div class="stats-grid">
          <article class="stat-card"><span class="stat-icon">🔥</span><strong id="streak-count">0</strong><span>連続達成日</span></article>
          <article class="stat-card"><span class="stat-icon">🏋️</span><strong id="total-count">0</strong><span>累計スクワット</span></article>
        </div>

        <button class="primary-button" id="add-record-button">＋ スクワットを記録</button>
        <article class="mission-card"><span>⚑</span><div><strong>本日のミッション</strong><p id="mission-text"></p></div></article>
      </section>

      <section id="history-page" class="page" aria-label="履歴">
        <div id="history-list" class="history-list"></div>
        <div id="history-empty" class="empty-state"><span>🗓️</span><h2>まだ記録がありません</h2><p>ホームから最初のスクワットを記録しましょう。</p></div>
      </section>

      <section id="collection-page" class="page" aria-label="屋敷">
        <p class="collection-summary">累計 <strong id="collection-total">0</strong> 回</p>
        <h2>メイドたち</h2><div id="maid-list" class="collection-list"></div>
        <h2>ごほうび</h2><div id="reward-list" class="collection-list"></div>
      </section>

      <section id="settings-page" class="page" aria-label="設定">
        <article class="settings-card"><label for="maid-name-input">メイドの名前</label><input id="maid-name-input" class="settings-input" maxlength="20" value="ルナ" placeholder="例：ルナ" /><p class="input-hint">応援メッセージやコレクションに反映されます。</p></article>
        <article class="settings-card"><label for="goal-input">1日の目標回数</label><div class="goal-control"><button id="goal-minus" aria-label="目標を減らす">−</button><input id="goal-input" type="number" inputmode="numeric" min="5" max="500" step="5" value="30" aria-label="1日の目標回数" /><span>回</span><button id="goal-plus" aria-label="目標を増やす">＋</button></div></article>
        <article class="settings-card about"><strong>スクワットメイド</strong><p>毎日の小さな積み重ねを、メイドたちと楽しみましょう。</p></article>
      </section>
    </main>

    <nav class="tab-bar" aria-label="メインメニュー">
      <button class="tab active" data-page="home"><span>⌂</span>ホーム</button>
      <button class="tab" data-page="history"><span>▣</span>履歴</button>
      <button class="tab" data-page="collection"><span>✦</span>屋敷</button>
    </nav>

    <dialog id="record-dialog">
      <form id="record-form" method="dialog">
        <div class="dialog-header"><h2>記録する</h2><button class="close-button" value="cancel" aria-label="閉じる">×</button></div>
        <label class="form-label" for="count-input">今回のスクワット</label>
        <div class="count-picker"><button type="button" id="count-minus" aria-label="回数を減らす">−</button><input id="count-input" type="number" inputmode="numeric" min="1" max="500" value="10" aria-label="スクワット回数" /><span>回</span><button type="button" id="count-plus" aria-label="回数を増やす">＋</button></div>
        <label class="form-label" for="memo-input">メモ（任意）</label>
        <input id="memo-input" maxlength="80" placeholder="例：朝の運動" />
        <p class="maid-tip">ルナ「無理は禁物です。きれいな姿勢でいきましょう！」</p>
        <button class="primary-button" value="default">保存する</button>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
